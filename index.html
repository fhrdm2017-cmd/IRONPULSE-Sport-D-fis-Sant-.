    function createCardArt(title, subtitle, accentHex, secondaryHex, badgeText) {
      return `
        <svg viewBox="0 0 420 175" class="w-full h-36 rounded-2xl overflow-hidden shadow-lg">
          <defs>
            <linearGradient id="g_${title.replace(/\W/g,'')}" x1="0%" y1="0%" x2="100%" y2="100%">

              <stop offset="55%" stop-color="#142038"/>
              <stop offset="100%" stop-color="${accentHex}" stop-opacity="0.35"/>

          </defs>
          <rect width="420" height="175" fill="url(#g_${title.replace(/\W/g,'')})"/>
          <circle cx="335" cy="78" r="74" fill="${accentHex}" opacity="0.22"/>
          <circle cx="355" cy="115" r="46" fill="${secondaryHex}" opacity="0.2"/>
          <path d="M312 46 C322 46 329 53 329 63 C329 73 322 80 312 80 C302 80 295 73 295 63 C295 53 302 46 312 46 Z" fill="#f8fafc"/>

        </svg>

    }

    const BODY_PART_SERIES = [
      { key: "chest", color: "#ff6b00", sec: "#ffb800", bpm: "138 BPM", exercise: "Pompes Explosives & Déclinées", sets: 4, reps: "12-15 reps", rest: 30, pose: "pushup" },
      { key: "back", color: "#00b4d8", sec: "#38bdf8", bpm: "132 BPM", exercise: "Tirage Dos & Superman Athlétique", sets: 4, reps: "15 reps", rest: 30, pose: "back" },
      { key: "shoulders", color: "#a855f7", sec: "#ec4899", bpm: "135 BPM", exercise: "Pike Push-Ups Épaules Sculptées", sets: 3, reps: "10-12 reps", rest: 35, pose: "pushup" },
      { key: "arms", color: "#ec4899", sec: "#f43f5e", bpm: "128 BPM", exercise: "Dips Triceps & Gainage Bras", sets: 4, reps: "12-15 reps", rest: 30, pose: "squat" },
      { key: "abs", color: "#10b981", sec: "#34d399", bpm: "124 BPM", exercise: "Gainage Abdominaux & Crunchs", sets: 4, reps: "45 sec", rest: 25, pose: "plank" },
      { key: "legs", color: "#eab308", sec: "#f97316", bpm: "146 BPM", exercise: "Squats Profonds & Fentes Puissance", sets: 4, reps: "16 reps", rest: 35, pose: "squat" }
    ];

    const CHALLENGES = [
      { title: "Défi 30 Jours • Régularité", sub: "Base solide • 20 min / jour", days: 30, done: 14, color: "from-orange-500 to-amber-400", hex: "#ff6b00" },
      { title: "Défi 60 Jours • Puissance & Volume", sub: "Séries intensives • Haut & Bas", days: 60, done: 27, color: "from-cyan-400 to-blue-500", hex: "#00b4d8" },
      { title: "Défi 90 Jours • Transformation Totale", sub: "Programme complet • Physique & Mental", days: 90, done: 42, color: "from-emerald-400 to-teal-500", hex: "#10b981" }
    ];

    const state = {
      lang: "fr",
      tab: "home",
      isPro: false,
      voiceEnabled: true,
      selectedIndex: 0,
      currentSet: 1,
      restSeconds: 0,
      statusMessage: "",
      water: 6,
      weight: 78.2,
      sleep: 7.5,
      animFrame: 0
    };

    let timerInterval = null;

    function speak(text) {
      state.statusMessage = text;
      render();
      if (!state.voiceEnabled || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const langMap = { fr: "fr-FR", en: "en-US", es: "es-ES", ar: "ar-SA", it: "it-IT" };
        utter.lang = langMap[state.lang] || "fr-FR";
        utter.rate = 1.02;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function startRest(seconds, message) {
      clearInterval(timerInterval);
      state.restSeconds = seconds;
      speak(message);
      timerInterval = setInterval(() => {
        state.restSeconds -= 1;
        if (state.restSeconds <= 0) {
          clearInterval(timerInterval);
          state.restSeconds = 0;
          speak(TRANSLATIONS[state.lang].voiceLines.restEnd);
        }
        render();
      }, 1000);
      render();
    }

    setInterval(() => {
      state.animFrame = (state.animFrame + 1) % 2;
      const athlete = document.getElementById("human-coach-group");
      if (athlete) {
        athlete.style.transform = state.animFrame === 0 ? "translateY(0px)" : "translateY(-7px)";
      }
    }, 620);

    function renderHumanCoach(accent, pose) {
      const up = state.animFrame === 1;
      let bodyPoseSvg = "";

      if (pose === "pushup") {
        bodyPoseSvg = `
          <line x1="35" y1="146" x2="225" y2="146" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
          <g transform="translate(0, ${up ? -14 : 6})">
            <path d="M58 122 L118 112" stroke="#1e293b" stroke-width="15" stroke-linecap="round"/>
            <path d="M58 122 L118 112" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
            <path d="M116 112 L176 96" stroke="${accent}" stroke-width="22" stroke-linecap="round"/>
            <path d="M168 98 L166 138" stroke="#f1f5f9" stroke-width="11" stroke-linecap="round"/>
            <circle cx="192" cy="88" r="15" fill="#f59e0b"/>
            <path d="M181 80 Q192 70 205 79" fill="#0f172a"/>
          </g>
        `;
      } else if (pose === "plank") {
        bodyPoseSvg = `
          <line x1="35" y1="146" x2="225" y2="146" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
          <g transform="translate(0, ${up ? -4 : 0})">
            <path d="M54 114 L172 104" stroke="${accent}" stroke-width="20" stroke-linecap="round"/>
            <path d="M162 105 L158 140" stroke="#f1f5f9" stroke-width="11" stroke-linecap="round"/>
            <circle cx="188" cy="96" r="15" fill="#f59e0b"/>
            <path d="M177 88 Q188 78 201 87" fill="#0f172a"/>
          </g>
        `;
      } else {
        bodyPoseSvg = `
          <line x1="35" y1="152" x2="225" y2="152" stroke="#334155" stroke-width="3" stroke-dasharray="6 6"/>
          <g transform="translate(0, ${up ? -10 : 8})">
            <path d="M114 96 L94 124 L98 148" stroke="#e2e8f0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M126 96 L146 124 L142 148" stroke="#cbd5e1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M98 48 L142 48 L134 98 L106 98 Z" fill="${accent}"/>
            <path d="M98 52 L74 34" stroke="#f8fafc" stroke-width="11" stroke-linecap="round"/>
            <path d="M142 52 L166 34" stroke="#f8fafc" stroke-width="11" stroke-linecap="round"/>
            <circle cx="120" cy="27" r="15" fill="#f59e0b"/>
            <path d="M108 21 Q120 10 133 21" fill="#0f172a"/>
          </g>
        `;
      }

      return `
        <div class="relative rounded-3xl bg-gradient-to-b from-[#111b31] to-[#080d18] border border-slate-800 p-4 overflow-hidden">
          <div class="absolute -top-8 right-6 w-36 h-36 rounded-full blur-3xl opacity-30" style="background:${accent}"></div>
          <svg viewBox="0 0 260 165" class="w-full h-40 relative z-10">
            <g id="human-coach-group" class="transition-transform duration-300">
              ${bodyPoseSvg}
            </g>
          </svg>
        </div>
      `;
    }

    function render() {
      const t = TRANSLATIONS[state.lang];
      const isRtl = state.lang === "ar";
      const cur = BODY_PART_SERIES[state.selectedIndex];
      const partName = t.parts[cur.key];
      const app = document.getElementById("app");
      app.setAttribute("dir", isRtl ? "rtl" : "ltr");

      let mainHtml = "";

      if (state.tab === "home") {
        mainHtml = `
          <div class="space-y-4">
            ${createCardArt(partName, cur.exercise + " • " + cur.bpm, cur.color, cur.sec, t.todaySession.toUpperCase())}

            <div class="glass rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-gradient-to-r from-orange-500 to-amber-400 text-slate-950">${t.trialBadge}</span>
                <span class="text-xs font-bold text-amber-300">${t.priceLabel}</span>
              </div>
              <div class="flex gap-2">
                <button onclick="startSessionNow()" class="flex-1 py-3 px-4 rounded-xl bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-400 text-slate-950 font-extrabold text-sm shadow-lg">
                  ▶ ${t.startWorkout}

              </div>
              ${!state.isPro ? `
                <button onclick="activateTrial()" class="w-full py-2.5 px-4 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-300 font-bold text-xs">
                  ✦ ${t.startTrial} (${t.priceLabel})
                </button>
              ` : `
                <div class="w-full py-2 px-3 rounded-xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 text-xs font-extrabold text-center">
                  ✓ ${t.proActive}
                </div>
              `}
            </div>

            <div>
              <h3 class="text-sm font-extrabold text-white mb-2.5">${t.bodyParts}</h3>
              <div class="grid grid-cols-2 gap-2.5">
                ${BODY_PART_SERIES.map((item, idx) => `
                  <button onclick="selectPart(${idx})" class="text-start p-3 rounded-2xl border transition ${idx === state.selectedIndex ? 'bg-slate-800/95 border-white/50 shadow-md' : 'bg-slate-900/75 border-slate-800 hover:border-slate-700'}">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full text-slate-950" style="background:${item.color}">
                        ${t.parts[item.key]}
                      </span>
                      <span class="text-[11px] font-bold text-slate-400">${item.bpm}</span>
                    </div>
                    <div class="text-xs font-bold text-white mt-2 line-clamp-1">${item.exercise}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${item.sets} séries • ${item.reps}</div>
                  </button>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      } else if (state.tab === "workouts") {
        mainHtml = `
          <div class="space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full text-slate-950" style="background:${cur.color}">${partName}</span>
                <h2 class="text-base font-black text-white mt-1">${cur.exercise}</h2>
              </div>
              <button onclick="toggleVoice()" class="px-3 py-2 rounded-xl text-xs font-extrabold border ${state.voiceEnabled ? 'bg-cyan-500/20 border-cyan-400/50 text-cyan-200' : 'bg-slate-800 border-slate-700 text-slate-400'}">
                ${state.voiceEnabled ? "🔊 " + t.voiceOn : "🔇 " + t.voiceOff}
              </button>
            </div>

            ${renderHumanCoach(cur.color, cur.pose)}

            <div class="glass rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-slate-300">${t.voiceCoach}</span>
                <span class="font-extrabold px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300">
                  Série ${state.currentSet} / ${cur.sets}
                </span>
              </div>

              <div class="text-xs text-cyan-100 bg-cyan-950/50 border border-cyan-700/40 rounded-xl p-3 min-h-[46px] font-medium">
                ${state.statusMessage || t.voiceLines.start}
              </div>

              ${state.restSeconds > 0 ? `
                <div class="p-3.5 rounded-xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-between">
                  <span class="text-sm font-black text-amber-300">${t.restTimer}: ${state.restSeconds}s</span>
                  <button onclick="skipRest()" class="px-3.5 py-1.5 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-xs">${t.skipRest}</button>
                </div>
              ` : `
                <button onclick="completeSet()" class="w-full py-3 rounded-xl font-black text-sm text-slate-950 shadow-lg" style="background:${cur.color}">
                  ✓ ${t.nextSet} (${cur.reps})
                </button>
              `}
            </div>
          </div>
        `;
      } else if (state.tab === "challenges") {
        mainHtml = `
          <div class="space-y-3.5">
            ${createCardArt("DÉFIS 30 • 60 • 90 JOURS", "Discipline, force & transformation physique", "#10b981", "#00b4d8", "LONGUE DURÉE")}
            ${CHALLENGES.map((c, idx) => {
              const pct = Math.round((c.done / c.days) * 100);
              return `
                <div class="glass rounded-2xl p-4 space-y-2.5">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="text-sm font-extrabold text-white">${c.title}</div>
                      <div class="text-[11px] text-slate-400">${c.sub}</div>
                    </div>
                    <span class="text-xs font-black text-emerald-300">${pct}%</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
                    <div class="h-full rounded-full bg-gradient-to-r ${c.color}" style="width:${pct}%"></div>
                  </div>
                  <div class="flex items-center justify-between text-xs text-slate-300 pt-1">
                    <span class="font-semibold">Jour ${c.done} / ${c.days}</span>
                    <button onclick="advanceChallenge(${idx})" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold">+1 Jour</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } else {
        mainHtml = `
          <div class="space-y-3.5">
            ${createCardArt("SANTÉ & RÉCUPÉRATION", "Hydratation, poids & qualité de sommeil", "#00b4d8", "#a855f7", "SUIVI SANTÉ")}
            <div class="glass rounded-2xl p-4 flex items-center justify-between">
              <div>
                <div class="text-xs text-slate-400 font-semibold">${t.water}</div>
                <div class="text-2xl font-black text-cyan-400 mt-0.5">${state.water} / 8 verres</div>
              </div>
              <button onclick="addWater()" class="px-4 py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">+1 Verre</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="glass rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">${t.weight}</div>
                <div class="text-xl font-black text-emerald-400 mt-1">${state.weight.toFixed(1)} kg</div>
              </div>
              <div class="glass rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">${t.sleep}</div>
                <div class="text-xl font-black text-purple-400 mt-1">${state.sleep.toFixed(1)} h</div>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <header class="p-4 border-b border-slate-800/80 bg-[#080d18]">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              ${ICON_SVG}
              <div>
                <h1 class="text-base font-black tracking-wide text-white">${t.appName}</h1>
                <p class="text-[11px] text-slate-400">${t.tagline}</p>
              </div>
            </div>
            <select onchange="changeLang(this.value)" class="bg-slate-900 text-white text-xs font-extrabold px-2.5 py-2 rounded-xl border border-slate-700">
              <option value="fr" ${state.lang === "fr" ? "selected" : ""}>🇫🇷 FR</option>
              <option value="en" ${state.lang === "en" ? "selected" : ""}>🇬🇧 EN</option>
              <option value="es" ${state.lang === "es" ? "selected" : ""}>🇪🇸 ES</option>
              <option value="ar" ${state.lang === "ar" ? "selected" : ""}>🇸🇦 AR</option>
              <option value="it" ${state.lang === "it" ? "selected" : ""}>🇮🇹 IT</option>
            </select>
          </div>
        </header>

        <main class="flex-1 p-4 overflow-y-auto">${mainHtml}</main>

        <nav class="grid grid-cols-4 border-t border-slate-800/90 bg-[#080d18] p-1.5 text-[11px] font-extrabold">
          <button onclick="setTab('home')" class="py-2.5 rounded-xl ${state.tab === 'home' ? 'bg-orange-500/20 text-orange-400' : 'text-slate-400'}">${t.home}</button>
          <button onclick="setTab('workouts')" class="py-2.5 rounded-xl ${state.tab === 'workouts' ? 'bg-cyan-500/20 text-cyan-300' : 'text-slate-400'}">${t.workouts}</button>
          <button onclick="setTab('challenges')" class="py-2.5 rounded-xl ${state.tab === 'challenges' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}">${t.challenges}</button>
          <button onclick="setTab('health')" class="py-2.5 rounded-xl ${state.tab === 'health' ? 'bg-purple-500/20 text-purple-400' : 'text-slate-400'}">${t.health}</button>
        </nav>
      `;
    }

    window.changeLang = (lang) => { state.lang = lang; render(); };
    window.setTab = (tab) => { state.tab = tab; render(); };
    window.selectPart = (idx) => { state.selectedIndex = idx; state.currentSet = 1; state.restSeconds = 0; state.tab = "workouts"; speak(TRANSLATIONS[state.lang].voiceLines.start); };
    window.startSessionNow = () => { state.currentSet = 1; state.restSeconds = 0; state.tab = "workouts"; speak(TRANSLATIONS[state.lang].voiceLines.start); };
    window.activateTrial = () => { state.isPro = true; speak(TRANSLATIONS[state.lang].proActive); };
    window.toggleVoice = () => { state.voiceEnabled = !state.voiceEnabled; render(); };
    window.skipRest = () => { clearInterval(timerInterval); state.restSeconds = 0; speak(TRANSLATIONS[state.lang].voiceLines.restEnd); };
    window.completeSet = () => {
      const t = TRANSLATIONS[state.lang];
      const series = BODY_PART_SERIES[state.selectedIndex];
      if (state.currentSet < series.sets) {
        state.currentSet += 1;
        startRest(series.rest, t.voiceLines.setDone);
      } else {
        speak(t.voiceLines.finish);
      }
    };
    window.advanceChallenge = (idx) => {
      if (CHALLENGES[idx].done < CHALLENGES[idx].days) CHALLENGES[idx].done += 1;
      render();
    };
    window.addWater = () => { if (state.water < 12) state.water += 1; render(); };

    render();
  </script>
</body>
</html>
