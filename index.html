<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRONPULSE — Fitness, Défis & Santé</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #1a2436;
      --text: #f3f6fb;
      --muted: #9aa7bd;
      --accent: #22c55e;
      --accent-2: #3b82f6;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 56px;
    }

    .container { max-width: 1020px; margin: 0 auto; padding: 16px; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0 16px;
    }

    .brand { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, input {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.88rem;
    }

    .pill {
      font-size: 0.78rem;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: 600;
    }

    .pill-gold {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .hero {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      align-items: flex-end;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .hero-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.58;
    }

    .hero-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 22px;
      background: linear-gradient(to top, rgba(11, 15, 23, 0.96), rgba(11, 15, 23, 0.32) 65%, transparent);
    }

    .hero h1 { font-size: 1.5rem; line-height: 1.22; margin-bottom: 8px; }
    .hero p { color: #dbe4f3; font-size: 0.94rem; max-width: 660px; margin-bottom: 14px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-gold { background: var(--gold); color: #271700; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-small { padding: 7px 12px; font-size: 0.82rem; border-radius: 10px; }

    .section-title { font-size: 1.08rem; font-weight: 700; margin: 20px 0 12px; }

    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 12px;
    }

    .zone-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      min-height: 155px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--card);
      border: 1px solid var(--border);
      text-align: inherit;
    }

    .zone-card.active-zone {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
    }

    .zone-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.52;
    }

    .zone-content {
      position: relative;
      z-index: 2;
      padding: 14px;
      background: linear-gradient(to top, rgba(11, 15, 23, 0.96), rgba(11, 15, 23, 0.2));
    }

    .zone-content h2 { font-size: 1.02rem; margin-bottom: 2px; }
    .zone-content p { font-size: 0.8rem; color: var(--muted); }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .workout-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 16px;
      align-items: center;
    }

    .coach-stage {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at top, #1e293b, #0c121d 75%);
      border: 1px solid var(--border);
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { width: 100%; height: 240px; display: block; }

    .timer-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0;
      font-variant-numeric: tabular-nums;
    }

    .stats-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .exercise-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .ex-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .ex-item h3 { font-size: 0.95rem; }
    .ex-item span { font-size: 0.8rem; color: var(--muted); }

    .challenge-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin: 10px 0 14px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .day-btn {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.8rem;
      text-align: center;
    }

    .day-btn.done {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--accent);
      color: #86efac;
    }

    .day-btn.selected {
      outline: 2px solid var(--accent-2);
    }

    .sub-box {
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.07);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .field label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .field input { width: 100%; }

    .diag-box {
      margin-top: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }

    .diag-row { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .diag-row:last-child { border-bottom: none; }
    .status-msg { margin-top: 8px; font-size: 0.84rem; color: #86efac; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">IRON<span>PULSE</span></div>
      <div class="header-controls">
        <select id="langSelect" aria-label="Langue">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
        <button class="btn-secondary btn-small" id="voiceToggleBtn" type="button"></button>
        <span class="pill pill-gold" id="trialBadge"></span>
      </div>
    </header>

    <!-- BANNIÈRE PRINCIPALE -->
    <section class="hero">
      <img id="img-hero" class="hero-media" alt="Hero" />
      <div class="hero-overlay">
        <h1 id="heroTitle"></h1>
        <p id="heroSubtitle"></p>
        <div class="btn-row">
          <button class="btn-primary" id="startBtn" type="button"></button>
          <button class="btn-secondary" id="toggleConfigBtn" type="button"></button>
          <button class="btn-secondary" id="toggleSubBtn" type="button"></button>
        </div>
      </div>
    </section>

    <!-- 4 ZONES -->
    <h2 class="section-title" id="zonesHeading"></h2>
    <div class="zones-grid">
      <button class="zone-card active-zone" data-zone="haut" type="button">
        <img id="img-haut" class="zone-media" alt="Haut du corps" />
        <div class="zone-content">
          <h2 id="zHautTitle"></h2>
          <p id="zHautSub"></p>
        </div>
      </button>
      <button class="zone-card" data-zone="bas" type="button">
        <img id="img-bas" class="zone-media" alt="Bas du corps" />
        <div class="zone-content">
          <h2 id="zBasTitle"></h2>
          <p id="zBasSub"></p>
        </div>
      </button>
      <button class="zone-card" data-zone="core" type="button">
        <img id="img-core" class="zone-media" alt="Abdos et cardio" />
        <div class="zone-content">
          <h2 id="zCoreTitle"></h2>
          <p id="zCoreSub"></p>
        </div>
      </button>
      <button class="zone-card" data-zone="sante" type="button">
        <img id="img-sante" class="zone-media" alt="Santé et mobilité" />
        <div class="zone-content">
          <h2 id="zSanteTitle"></h2>
          <p id="zSanteSub"></p>
        </div>
      </button>
    </div>

    <!-- STUDIO SÉANCE + COACH ANIMÉ -->
    <section class="panel" id="workoutPanel">
      <div class="workout-grid">
        <div class="coach-stage">
          <canvas id="coachCanvas" width="420" height="240"></canvas>
        </div>
        <div>
          <span id="zoneTag" style="font-size:0.8rem; color:#86efac; font-weight:700;"></span>
          <h2 id="exTitle" style="font-size:1.3rem; margin-top:2px;"></h2>
          <p id="exTip" style="color:var(--muted); font-size:0.9rem; margin-top:4px;"></p>
          <div class="timer-display" id="timerDisplay">00:30</div>
          <div class="btn-row">
            <button class="btn-primary btn-small" id="timerPlayBtn" type="button"></button>
            <button class="btn-secondary btn-small" id="timerResetBtn" type="button"></button>
            <button class="btn-secondary btn-small" id="nextExBtn" type="button"></button>
            <button class="btn-secondary btn-small" id="animToggleBtn" type="button"></button>
          </div>
          <div class="stats-strip">
            <span id="setsStat"></span>
            <span id="sessionsStat"></span>
          </div>
        </div>
      </div>
      <div class="exercise-list" id="exerciseList"></div>
    </section>

    <!-- DÉFIS 30, 60 ET 90 JOURS -->
    <section class="panel" id="challengesPanel">
      <h2 id="challengesHeading"></h2>
      <p id="challengesDesc" style="color:var(--muted); font-size:0.88rem; margin-top:4px;"></p>

      <div class="challenge-controls">
        <select id="challengeFocusSelect" aria-label="Objectif">
          <option value="musculation" id="optMuscu"></option>
          <option value="fitness" id="optFitness"></option>
          <option value="sante" id="optSante"></option>
        </select>
        <button class="btn-secondary btn-small challenge-len" data-days="30" type="button">30 J</button>
        <button class="btn-secondary btn-small challenge-len" data-days="60" type="button">60 J</button>
        <button class="btn-secondary btn-small challenge-len" data-days="90" type="button">90 J</button>
        <button class="btn-primary btn-small" id="toggleDayDoneBtn" type="button"></button>
        <button class="btn-secondary btn-small" id="launchDayWorkoutBtn" type="button"></button>
      </div>

      <div id="challengeSummary" style="font-size:0.88rem; font-weight:600;"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="challengeBar"></div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </section>

    <!-- ESSAI 7 JOURS & ABONNEMENT 2 €/MOIS -->
    <section class="sub-box" id="subPanel">
      <h2 id="subTitle"></h2>
      <p id="subDesc" style="color:var(--muted); font-size:0.9rem; margin-top:4px;"></p>
      <div class="config-grid">
        <div class="field">
          <label for="payUrlInput" id="payUrlLabel"></label>
          <input type="url" id="payUrlInput" placeholder="https://buy.stripe.com/..." />
        </div>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn-gold btn-small" id="openPayBtn" type="button"></button>
        <button class="btn-secondary btn-small" id="savePayBtn" type="button"></button>
        <button class="btn-secondary btn-small" id="resetTrialBtn" type="button"></button>
        <button class="btn-secondary btn-small" id="expireTrialBtn" type="button"></button>
        <button class="btn-secondary btn-small" id="toggleProBtn" type="button"></button>
      </div>
      <div class="status-msg" id="subStatus"></div>
    </section>

    <!-- RÉGLAGES GITHUB -->
    <section class="panel" id="configPanel" style="display:none;">
      <h2 id="ghTitle"></h2>
      <div class="config-grid">
        <div class="field"><label for="ghOwner">GitHub User</label><input type="text" id="ghOwner" /></div>
        <div class="field"><label for="ghRepo">Repo</label><input type="text" id="ghRepo" /></div>
        <div class="field"><label for="ghBranch">Branch</label><input type="text" id="ghBranch" /></div>
        <div class="field"><label for="ghFolder">Folder</label><input type="text" id="ghFolder" /></div>
        <div class="field"><label for="fHero">Hero</label><input type="text" id="fHero" /></div>
        <div class="field"><label for="fHaut">Upper</label><input type="text" id="fHaut" /></div>
        <div class="field"><label for="fBas">Lower</label><input type="text" id="fBas" /></div>
        <div class="field"><label for="fCore">Core & Cardio</label><input type="text" id="fCore" /></div>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn-primary btn-small" id="saveGhBtn" type="button"></button>
      </div>
      <div class="status-msg" id="ghStatus"></div>
      <div class="diag-box" id="diagBox"></div>
    </section>
  </div>

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY));
        return {
          ...DEFAULT_STATE,
          ...raw,
          completed: { ...(raw && raw.completed ? raw.completed : {}) },
          gh: {
            ...DEFAULT_STATE.gh,
            ...(raw && raw.gh ? raw.gh : {}),
            files: { ...DEFAULT_STATE.gh.files, ...(raw && raw.gh && raw.gh.files ? raw.gh.files : {}) }
          }
        };
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }

      localStorage.setItem(KEY, JSON.stringify(state));

      return I18N[state.lang] || I18N.fr;

    function speak(text) {
      if (!state.voice) return;
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = t().voice;
        window.speechSynthesis.speak(u);
      } catch {}
    }

    function getTrialInfo() {
      if (state.isPro) return { status: "pro", daysLeft: 0 };
      if (state.trialSimulatedEnded) return { status: "ended", daysLeft: 0 };
      const elapsedDays = Math.floor((Date.now() - state.trialStart) / 86400000);
      const left = Math.max(0, TRIAL_DAYS - elapsedDays);
      return { status: left > 0 ? "trial" : "ended", daysLeft: left };
    }

    function renderTrialBadge() {
      const info = getTrialInfo();
      const badge = document.getElementById("trialBadge");
      if (info.status === "pro") badge.textContent = t().proActive;
      else if (info.status === "trial") badge.textContent = t().trialActive(info.daysLeft);
      else badge.textContent = t().trialEnded;
    }

    function buildPhotoCandidates(fileName) {
      const clean = (fileName || "").trim();
      if (!clean) return [];
      if (/^https?:\/\//i.test(clean)) return [clean];
      const owner = (state.gh.owner || "").trim();
      const repo = (state.gh.repo || "").trim();
      const repoNoDot = repo.replace(/\.+$/, "");
      const branch = (state.gh.branch || "main").trim();
      const folder = (state.gh.folder || "").trim().replace(/^\/+|\/+$/g, "");
      const repos = [...new Set([repo, repoNoDot].filter(Boolean))];
      const branches = [...new Set([branch, "main", "master"])];
      const folders = [...new Set([folder, "", "images", "img", "assets"])];
      const noDot = clean.replace(/^\.+/, "");
      const base = noDot.replace(/\.(jpg|jpeg|png|webp)$/i, "");
      const names = [...new Set([clean, noDot, `${base}.jpg`, `${base}.jpeg`, `${base}.png`])];
      const out = [];
      for (const r of repos) for (const b of branches) for (const f of folders) for (const fn of names) {
        out.push(`https://raw.githubusercontent.com/${owner}/${r}/${b}/${f ? `${f}/${fn}` : fn}`);
      }
      return [...new Set(out)];
    }

    function loadPhoto(key, imgEl, fileName, diagId) {
      const cands = buildPhotoCandidates(fileName);
      const diag = diagId ? document.getElementById(diagId) : null;
      if (!cands.length) { imgEl.style.display = "none"; return; }
      let idx = 0;
      function step() {
        if (idx >= cands.length) {
          imgEl.style.display = "none";
          if (diag) { diag.textContent = `${fileName} → Non trouvé`; diag.style.color = "#fca5a5"; }
          return;
        }
        const url = cands[idx++];
        imgEl.style.display = "block";
        imgEl.onload = () => {
          resolvedPhotos[key] = url;
          if (diag) { diag.textContent = `OK : ${url}`; diag.style.color = "#86efac"; }
        };
        imgEl.onerror = step;
        imgEl.src = url;
      }
      step();
    }

    function renderPhotos() {
      const diagBox = document.getElementById("diagBox");
      diagBox.innerHTML = ["hero", "haut", "bas", "core"].map((k, i) =>
        `<div class="diag-row" id="d-${k}"><strong>#${i + 1} (${state.gh.files[k]})</strong> → ...</div>`
      ).join("");
      loadPhoto("hero", document.getElementById("img-hero"), state.gh.files.hero, "d-hero");
      loadPhoto("haut", document.getElementById("img-haut"), state.gh.files.haut, "d-haut");
      loadPhoto("bas", document.getElementById("img-bas"), state.gh.files.bas, "d-bas");

      loadPhoto("sante", document.getElementById("img-sante"), state.gh.files.hero, null);

    function formatSec(s) {
      const n = Math.max(0, s);
      return `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
    }

    function stopClock() {
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
      document.getElementById("timerPlayBtn").textContent = t().play;
    }

    function renderExercises() {
      const list = document.getElementById("exerciseList");
      const items = EXERCISES[state.zone].items;
      list.innerHTML = "";
      items.forEach((item, i) => {
        const div = document.createElement("div");
        div.className = "ex-item";
        div.style.borderColor = i === state.exIndex ? "var(--accent)" : "var(--border)";
        div.innerHTML = `
          <div>
            <h3>${item.title[state.lang] || item.title.fr}</h3>
            <span>${t().secLabel(item.dur)}</span>
          </div>
          <button class="btn-secondary btn-small" type="button">${t().choose}</button>
        `;
        div.querySelector("button").addEventListener("click", () => selectExercise(i, true));
        list.appendChild(div);
      });
    }

    function selectExercise(idx, announce) {
      stopClock();
      spokenFive = false;
      const zoneObj = EXERCISES[state.zone];
      state.exIndex = idx % zoneObj.items.length;
      const item = zoneObj.items[state.exIndex];
      remaining = item.dur;
      document.getElementById("exTitle").textContent = item.title[state.lang] || item.title.fr;
      document.getElementById("exTip").textContent = item.tip[state.lang] || item.tip.fr;
      document.getElementById("timerDisplay").textContent = formatSec(remaining);
      renderExercises();
      saveState();
      if (announce) speak(t().sayStart(item.title[state.lang] || item.title.fr, item.dur));
    }

    function selectZone(z) {
      state.zone = z;
      document.querySelectorAll(".zone-card").forEach((b) => b.classList.toggle("active-zone", b.dataset.zone === z));
      const zoneLabels = { haut: t().zHaut[0], bas: t().zBas[0], core: t().zCore[0], sante: t().zSante[0] };
      document.getElementById("zoneTag").textContent = zoneLabels[z] || "";
      selectExercise(0, false);
    }

    function dayDuration(dayNum) {
      const base = EXERCISES[state.zone].items[state.exIndex].dur;
      if (dayNum <= 10) return base;
      if (dayNum <= 25) return base + 5;
      return base + 10;
    }

    function renderChallenge() {
      const total = state.challengeDays;
      if (state.selectedDay > total) state.selectedDay = 1;
      const prefix = `${state.challengeFocus}_${total}_`;
      let doneCount = 0;
      for (let d = 1; d <= total; d++) if (state.completed[prefix + d]) doneCount++;
      const pct = Math.round((doneCount / total) * 100);
      const dur = dayDuration(state.selectedDay);
      const focusName = state.challengeFocus === "musculation" ? t().optMuscu
        : state.challengeFocus === "fitness" ? t().optFitness : t().optSante;

      document.getElementById("challengeSummary").textContent = t().summary(focusName, total, doneCount, total, pct, dur);
      document.getElementById("challengeBar").style.width = `${pct}%`;

      document.querySelectorAll(".challenge-len").forEach((b) => {
        b.className = `btn-small challenge-len ${Number(b.dataset.days) === total ? "btn-primary" : "btn-secondary"}`;
      });

      const grid = document.getElementById("daysGrid");
      grid.innerHTML = "";
      for (let d = 1; d <= total; d++) {
        const isDone = Boolean(state.completed[prefix + d]);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `day-btn ${isDone ? "done" : ""} ${d === state.selectedDay ? "selected" : ""}`;
        btn.textContent = t().dayBtn(d, isDone);
        btn.addEventListener("click", () => { state.selectedDay = d; saveState(); renderChallenge(); });
        grid.appendChild(btn);
      }
    }

      document.getElementById("ghTitle").textContent = tr.ghTitle;
      document.getElementById("saveGhBtn").textContent = tr.saveGh;

      selectZone(state.zone);
      renderChallenge();
    }

    // Coach athlétique sculpté sur Canvas (sans bonhomme bâton)
    const canvas = document.getElementById("coachCanvas");
    const ctx = canvas.getContext("2d");
    let phase = 0;

    function drawSculptedCoach() {
      if (state.anim) phase += 0.045;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const motion = EXERCISES[state.zone].motion;
      const wave = Math.sin(phase);
      const lift = Math.max(0, wave);

      let cx = w * 0.5;
      let cy = h * 0.52;
      let torsoTilt = 0;
      let legBend = lift * 14;
      let armAngle = wave * 0.45;

      if (motion === "push") {
        cy = h * 0.62 + lift * 18;
        torsoTilt = -0.35;
        armAngle = -0.4 - lift * 0.45;
      } else if (motion === "squat") {
        cy = h * 0.5 + lift * 22;
        legBend = lift * 24;
        armAngle = -0.35 - lift * 0.3;
      } else if (motion === "cardio") {
        cy = h * 0.52 - Math.abs(wave) * 14;
        legBend = Math.abs(wave) * 20;
        armAngle = wave * 0.7;
      } else {
        cy = h * 0.53 + wave * 6;
        torsoTilt = wave * 0.14;
        armAngle = -0.25 + wave * 0.25;
      }

      ctx.save();
      ctx.translate(cx, cy);

      // Sol d'appui
      ctx.fillStyle = "rgba(34, 197, 94, 0.14)";
      ctx.beginPath();
      ctx.ellipse(0, 88, 92, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.rotate(torsoTilt);

      // Jambes sculptées (cuisses + mollets)
      const skin = "#d69e7e";
      const shorts = "#1e293b";
      const shoe = "#22c55e";

      [-18, 18].forEach((hipX, i) => {
        const dir = i === 0 ? 1 : -1;
        const kneeX = hipX + dir * legBend * 0.5;
        const kneeY = 36 + legBend * 0.4;
        const footX = hipX + (motion === "cardio" ? wave * 18 * dir : 0);
        const footY = 82;

        ctx.strokeStyle = skin;
        ctx.lineWidth = 17;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(hipX, 8);
        ctx.lineTo(kneeX, kneeY);
        ctx.lineTo(footX, footY);
        ctx.stroke();

        // Short athlétique
        ctx.strokeStyle = shorts;
        ctx.lineWidth = 19;
        ctx.beginPath();
        ctx.moveTo(hipX, 4);
        ctx.lineTo(kneeX * 0.95, kneeY * 0.75);
        ctx.stroke();

        // Chaussure
        ctx.fillStyle = shoe;
        ctx.beginPath();
        ctx.ellipse(footX + 5, footY + 3, 13, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Torse sculpté en V
      ctx.fillStyle = "#2563eb";
      ctx.beginPath();
      ctx.moveTo(-34, -42);
      ctx.quadraticCurveTo(0, -52, 34, -42);
      ctx.lineTo(22, 10);
      ctx.quadraticCurveTo(0, 15, -22, 10);
      ctx.closePath();
      ctx.fill();

      // Bras sculptés
      [-32, 32].forEach((shX, i) => {
        ctx.save();
        ctx.translate(shX, -36);
        ctx.rotate((i === 0 ? 1 : -1) * armAngle);
        ctx.strokeStyle = skin;
        ctx.lineWidth = 12;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 38);
        ctx.stroke();
        ctx.restore();
      });

      // Cou & tête sculptée
      ctx.fillStyle = skin;
      ctx.fillRect(-7, -56, 14, 12);
      ctx.beginPath();
      ctx.arc(0, -68, 16, 0, Math.PI * 2);
      ctx.fill();

      // Cheveux courts
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(0, -71, 16.5, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();

      ctx.restore();
      requestAnimationFrame(drawSculptedCoach);
    }

    // Événements
    document.getElementById("langSelect").addEventListener("change", (e) => {
      state.lang = e.target.value;
      saveState();
      applyLanguage();
    });

    document.getElementById("voiceToggleBtn").addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        document.getElementById("subStatus").textContent = t().voiceUnavail;
        return;
      }
      state.voice = !state.voice;
      saveState();
      applyLanguage();
    });

    document.querySelectorAll(".zone-card").forEach((b) => b.addEventListener("click", () => selectZone(b.dataset.zone)));

    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("workoutPanel").scrollIntoView({ behavior: "smooth" });
      if (!intervalId) document.getElementById("timerPlayBtn").click();
    });

    document.getElementById("timerPlayBtn").addEventListener("click", () => {
      if (intervalId) { stopClock(); return; }
      if (remaining <= 0) remaining = EXERCISES[state.zone].items[state.exIndex].dur;
      const item = EXERCISES[state.zone].items[state.exIndex];
      speak(t().sayStart(item.title[state.lang] || item.title.fr, remaining));
      document.getElementById("timerPlayBtn").textContent = t().pause;
      intervalId = setInterval(() => {
        remaining -= 1;
        document.getElementById("timerDisplay").textContent = formatSec(remaining);
        if (remaining === 5 && !spokenFive) { spokenFive = true; speak("5"); }
        if (remaining <= 0) {
          stopClock();
          state.sets += 1;
          if (state.sets % 3 === 0) state.sessions += 1;
          saveState();
          document.getElementById("setsStat").textContent = t().setsStat(state.sets);
          document.getElementById("sessionsStat").textContent = t().sessionsStat(state.sessions);
          speak(t().sayDone);
        }
      }, 1000);
    });

    document.getElementById("timerResetBtn").addEventListener("click", () => {
      stopClock();
      spokenFive = false;
      remaining = EXERCISES[state.zone].items[state.exIndex].dur;
      document.getElementById("timerDisplay").textContent = formatSec(remaining);
    });

    document.getElementById("nextExBtn").addEventListener("click", () => selectExercise(state.exIndex + 1, true));

    document.getElementById("animToggleBtn").addEventListener("click", () => {
      state.anim = !state.anim;
      saveState();
      document.getElementById("animToggleBtn").textContent = state.anim ? t().animOn : t().animOff;
    });

    document.getElementById("challengeFocusSelect").addEventListener("change", (e) => {
      state.challengeFocus = e.target.value;
      saveState();
      renderChallenge();
    });

    document.querySelectorAll(".challenge-len").forEach((b) => {
      b.addEventListener("click", () => {
        state.challengeDays = Number(b.dataset.days);
        saveState();
        renderChallenge();
      });
    });

    document.getElementById("toggleDayDoneBtn").addEventListener("click", () => {
      const k = `${state.challengeFocus}_${state.challengeDays}_${state.selectedDay}`;
      state.completed[k] = !state.completed[k];
      saveState();
      renderChallenge();
    });

    document.getElementById("launchDayWorkoutBtn").addEventListener("click", () => {
      stopClock();
      spokenFive = false;
      remaining = dayDuration(state.selectedDay);
      document.getElementById("timerDisplay").textContent = formatSec(remaining);
      document.getElementById("workoutPanel").scrollIntoView({ behavior: "smooth" });
      document.getElementById("timerPlayBtn").click();
    });

    // Abonnement 2 €/mois & essai 7j
    document.getElementById("payUrlInput").value = state.payUrl || "";
    document.getElementById("toggleSubBtn").addEventListener("click", () => {
      document.getElementById("subPanel").scrollIntoView({ behavior: "smooth" });
    });

    document.getElementById("savePayBtn").addEventListener("click", () => {
      state.payUrl = document.getElementById("payUrlInput").value.trim();
      saveState();
      document.getElementById("subStatus").textContent = t().paySaved;
    });

    document.getElementById("openPayBtn").addEventListener("click", () => {
      const url = document.getElementById("payUrlInput").value.trim() || state.payUrl;
      if (!url) { document.getElementById("subStatus").textContent = t().noPayUrl; return; }
      window.open(url, "_blank", "noopener,noreferrer");
    });

    document.getElementById("resetTrialBtn").addEventListener("click", () => {
      state.trialStart = Date.now();
      state.trialSimulatedEnded = false;
      saveState();
      renderTrialBadge();
      document.getElementById("subStatus").textContent = t().trialResetMsg;
    });

    document.getElementById("expireTrialBtn").addEventListener("click", () => {
      state.isPro = false;
      state.trialSimulatedEnded = true;
      saveState();
      renderTrialBadge();
      document.getElementById("subStatus").textContent = t().trialExpMsg;
    });

    document.getElementById("toggleProBtn").addEventListener("click", () => {
      state.isPro = !state.isPro;
      if (state.isPro) state.trialSimulatedEnded = false;
      saveState();
      renderTrialBadge();
      document.getElementById("subStatus").textContent = t().proMsg(state.isPro);
    });

    // Réglages GitHub
    function fillGhForm() {
      document.getElementById("ghOwner").value = state.gh.owner;
      document.getElementById("ghRepo").value = state.gh.repo;
      document.getElementById("ghBranch").value = state.gh.branch;
      document.getElementById("ghFolder").value = state.gh.folder;
      document.getElementById("fHero").value = state.gh.files.hero;
      document.getElementById("fHaut").value = state.gh.files.haut;
      document.getElementById("fBas").value = state.gh.files.bas;
      document.getElementById("fCore").value = state.gh.files.core;
    }

    document.getElementById("toggleConfigBtn").addEventListener("click", () => {
      const p = document.getElementById("configPanel");
      const show = p.style.display === "none";
      p.style.display = show ? "block" : "none";
      if (show) { fillGhForm(); renderPhotos(); p.scrollIntoView({ behavior: "smooth" }); }
    });

    document.getElementById("saveGhBtn").addEventListener("click", () => {
      state.gh = {
        owner: document.getElementById("ghOwner").value.trim(),
        repo: document.getElementById("ghRepo").value.trim(),
        branch: document.getElementById("ghBranch").value.trim() || "main",
        folder: document.getElementById("ghFolder").value.trim(),
        files: {
          hero: document.getElementById("fHero").value.trim(),
          haut: document.getElementById("fHaut").value.trim(),
          bas: document.getElementById("fBas").value.trim(),
          core: document.getElementById("fCore").value.trim()
        }
      };
      saveState();
      renderPhotos();
      document.getElementById("ghStatus").textContent = t().ghSaved;
    });

    document.getElementById("challengeFocusSelect").value = state.challengeFocus;
    fillGhForm();
    applyLanguage();
    renderPhotos();
    drawSculptedCoach();
  </script>
</body>
</html>
