  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #111c33 0%, #060911 70%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }
    @keyframes coachBreathe {
      0%, 100% { transform: scale(1) translateY(0px); }
      50% { transform: scale(1.035) translateY(-4px); }
    }
    .coach-live {
      animation: coachBreathe 2.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">
  <div id="app" class="w-full max-w-md rounded-[32px] bg-[#0a101d] border border-slate-800/90 shadow-[0_25px_70px_rgba(0,0,0,0.85)] overflow-hidden flex flex-col min-h-[830px]"></div>

        bodyParts: "Serie per gruppo muscolare",

        voiceOn: "Voce ON",

        sleep: "Sonno",
        voiceLines: {

          setDone: "Serie completata! Respira a fondo e resta concentrato.",

    const BODY_PART_SERIES = [
      { key: "chest", color: "#ff6b00", bpm: "138 BPM", exercise: "Pompes Explosives & Déclinées", sets: 4, reps: "12-15 reps", rest: 30, img: COACH_IMAGES.pushup },
      { key: "back", color: "#00b4d8", bpm: "132 BPM", exercise: "Tirage Dos & Gainage Athlétique", sets: 4, reps: "15 reps", rest: 30, img: COACH_IMAGES.hero },
      { key: "shoulders", color: "#a855f7", bpm: "135 BPM", exercise: "Pike Push-Ups Épaules Sculptées", sets: 3, reps: "10-12 reps", rest: 35, img: COACH_IMAGES.pushup },
      { key: "arms", color: "#ec4899", bpm: "128 BPM", exercise: "Dips Triceps & Gainage Bras", sets: 4, reps: "12-15 reps", rest: 30, img: COACH_IMAGES.hero },
      { key: "abs", color: "#10b981", bpm: "124 BPM", exercise: "Gainage Abdominaux & Crunchs", sets: 4, reps: "45 sec", rest: 25, img: COACH_IMAGES.pushup },
      { key: "legs", color: "#eab308", bpm: "146 BPM", exercise: "Squats Profonds & Fentes Puissance", sets: 4, reps: "16 reps", rest: 35, img: COACH_IMAGES.squat }
    ];

    const CHALLENGES = [
      { title: "Défi 30 Jours • Régularité", sub: "Base solide • 20 min / jour", days: 30, done: 14, color: "from-orange-500 to-amber-400" },
      { title: "Défi 60 Jours • Puissance & Volume", sub: "Séries intensives • Haut & Bas", days: 60, done: 27, color: "from-cyan-400 to-blue-500" },
      { title: "Défi 90 Jours • Transformation Totale", sub: "Programme complet • Physique & Mental", days: 90, done: 42, color: "from-emerald-400 to-teal-500" }
    ];

    const state = {
      lang: "fr",
      tab: "home",
      isPro: false,
      voiceEnabled: true,
      selectedIndex: 0,
      currentSet: 1,
      restSeconds: 0,
      statusMessage: "",
      water: 6,
      weight: 78.2,
      sleep: 7.5
    };

    let timerInterval = null;

    function speak(text) {
      state.statusMessage = text;
      render();
      if (!state.voiceEnabled || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        const langMap = { fr: "fr-FR", en: "en-US", es: "es-ES", ar: "ar-SA", it: "it-IT" };
        utter.lang = langMap[state.lang] || "fr-FR";
        utter.rate = 1.02;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function startRest(seconds, message) {
      clearInterval(timerInterval);
      state.restSeconds = seconds;
      speak(message);
      timerInterval = setInterval(() => {
        state.restSeconds -= 1;
        if (state.restSeconds <= 0) {
          clearInterval(timerInterval);
          state.restSeconds = 0;
          speak(TRANSLATIONS[state.lang].voiceLines.restEnd);
        }
        render();
      }, 1000);
      render();
    }

    function renderPhotoBanner(imgSrc, badgeText, title, subtitle, accentColor) {
      return `
        <div class="relative h-44 rounded-3xl overflow-hidden border border-slate-800 shadow-xl bg-slate-900">
          <img src="${imgSrc}" alt="${title}" class="w-full h-full object-cover object-center opacity-90" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#070b14] via-[#070b14]/50 to-transparent"></div>
          <div class="absolute top-3 left-3">
            <span class="text-[10px] font-black uppercase tracking-wider px-3 py-1 rounded-full text-slate-950 shadow" style="background:${accentColor}">
              ${badgeText}
            </span>
          </div>
          <div class="absolute bottom-3 left-3.5 right-3.5">
            <h2 class="text-lg font-black text-white leading-tight">${title}</h2>
            <p class="text-xs text-slate-200 font-medium mt-0.5">${subtitle}</p>
          </div>
        </div>
      `;
    }

    function render() {
      const t = TRANSLATIONS[state.lang];
      const isRtl = state.lang === "ar";
      const cur = BODY_PART_SERIES[state.selectedIndex];
      const partName = t.parts[cur.key];
      const app = document.getElementById("app");
      app.setAttribute("dir", isRtl ? "rtl" : "ltr");

      let mainHtml = "";

      if (state.tab === "home") {
        mainHtml = `
          <div class="space-y-4">
            ${renderPhotoBanner(COACH_IMAGES.hero, t.todaySession, partName, cur.exercise + " • " + cur.bpm, cur.color)}

            <div class="glass rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-gradient-to-r from-orange-500 to-amber-400 text-slate-950">${t.trialBadge}</span>
                <span class="text-xs font-bold text-amber-300">${t.priceLabel}</span>
              </div>
              <button onclick="startSessionNow()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-400 text-slate-950 font-extrabold text-sm shadow-lg">
                ▶ ${t.startWorkout}
              </button>
              ${!state.isPro ? `
                <button onclick="activateTrial()" class="w-full py-2.5 px-4 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-300 font-bold text-xs">
                  ✦ ${t.startTrial} (${t.priceLabel})
                </button>
              ` : `
                <div class="w-full py-2 px-3 rounded-xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 text-xs font-extrabold text-center">
                  ✓ ${t.proActive}
                </div>
              `}
            </div>

            <div>
              <h3 class="text-sm font-extrabold text-white mb-2.5">${t.bodyParts}</h3>
              <div class="grid grid-cols-2 gap-2.5">
                ${BODY_PART_SERIES.map((item, idx) => `
                  <button onclick="selectPart(${idx})" class="text-start overflow-hidden rounded-2xl border transition ${idx === state.selectedIndex ? 'bg-slate-800/95 border-white/60 shadow-lg' : 'bg-slate-900/80 border-slate-800 hover:border-slate-700'}">
                    <div class="relative h-20 w-full bg-slate-950">
                      <img src="${item.img}" alt="${t.parts[item.key]}" class="w-full h-full object-cover opacity-80" />
                      <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                      <span class="absolute bottom-1.5 left-2 text-[10px] font-black px-2 py-0.5 rounded-full text-slate-950" style="background:${item.color}">
                        ${t.parts[item.key]}
                      </span>
                    </div>
                    <div class="p-2.5">
                      <div class="text-xs font-bold text-white line-clamp-1">${item.exercise}</div>
                      <div class="text-[11px] text-slate-400 mt-0.5">${item.sets} séries • ${item.reps}</div>
                    </div>
                  </button>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      } else if (state.tab === "workouts") {
        mainHtml = `
          <div class="space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full text-slate-950" style="background:${cur.color}">${partName}</span>
                <h2 class="text-base font-black text-white mt-1">${cur.exercise}</h2>
              </div>
              <button onclick="toggleVoice()" class="px-3 py-2 rounded-xl text-xs font-extrabold border ${state.voiceEnabled ? 'bg-cyan-500/20 border-cyan-400/50 text-cyan-200' : 'bg-slate-800 border-slate-700 text-slate-400'}">
                ${state.voiceEnabled ? "🔊 " + t.voiceOn : "🔇 " + t.voiceOff}
              </button>
            </div>

            <div class="relative h-56 rounded-3xl overflow-hidden border border-slate-800 bg-slate-950 shadow-2xl">
              <img src="${cur.img}" alt="${cur.exercise}" class="coach-live w-full h-full object-cover object-center" />
              <div class="absolute inset-0 bg-gradient-to-t from-[#070b14] via-transparent to-transparent"></div>
              <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-xs">
                <span class="px-2.5 py-1 rounded-full bg-black/70 text-white font-bold border border-white/15">${cur.bpm}</span>
                <span class="px-2.5 py-1 rounded-full bg-black/70 text-amber-300 font-extrabold border border-amber-400/30">
                  Série ${state.currentSet} / ${cur.sets}
                </span>
              </div>
            </div>

            <div class="glass rounded-2xl p-4 space-y-3">
              <div class="text-xs font-bold text-slate-300">${t.voiceCoach}</div>
              <div class="text-xs text-cyan-100 bg-cyan-950/50 border border-cyan-700/40 rounded-xl p-3 min-h-[46px] font-medium">
                ${state.statusMessage || t.voiceLines.start}
              </div>

              ${state.restSeconds > 0 ? `
                <div class="p-3.5 rounded-xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-between">
                  <span class="text-sm font-black text-amber-300">${t.restTimer}: ${state.restSeconds}s</span>
                  <button onclick="skipRest()" class="px-3.5 py-1.5 rounded-lg bg-amber-400 text-slate-950 font-extrabold text-xs">${t.skipRest}</button>
                </div>
              ` : `
                <button onclick="completeSet()" class="w-full py-3 rounded-xl font-black text-sm text-slate-950 shadow-lg" style="background:${cur.color}">
                  ✓ ${t.nextSet} (${cur.reps})
                </button>

            ${CHALLENGES.map((c, idx) => {
              const pct = Math.round((c.done / c.days) * 100);
              return `

                  <div class="flex items-center justify-between">
                    <div>
                      <div class="text-sm font-extrabold text-white">${c.title}</div>
                      <div class="text-[11px] text-slate-400">${c.sub}</div>
                    </div>
                    <span class="text-xs font-black text-emerald-300">${pct}%</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full bg-slate-800 overflow-hidden">
                    <div class="h-full rounded-full bg-gradient-to-r ${c.color}" style="width:${pct}%"></div>
                  </div>
                  <div class="flex items-center justify-between text-xs text-slate-300 pt-1">
                    <span class="font-semibold">Jour ${c.done} / ${c.days}</span>
                    <button onclick="advanceChallenge(${idx})" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold">+1 Jour</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } else {
        mainHtml = `
          <div class="space-y-3.5">
            ${renderPhotoBanner(COACH_IMAGES.hero, "SUIVI SANTÉ", "SANTÉ & RÉCUPÉRATION", "Hydratation, poids & qualité de sommeil", "#00b4d8")}
            <div class="glass rounded-2xl p-4 flex items-center justify-between">
              <div>
                <div class="text-xs text-slate-400 font-semibold">${t.water}</div>

            <div class="grid grid-cols-2 gap-3">
              <div class="glass rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">${t.weight}</div>
                <div class="text-xl font-black text-emerald-400 mt-1">${state.weight.toFixed(1)} kg</div>
              </div>
              <div class="glass rounded-2xl p-4">
                <div class="text-xs text-slate-400 font-semibold">${t.sleep}</div>
                <div class="text-xl font-black text-purple-400 mt-1">${state.sleep.toFixed(1)} h</div>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        <header class="p-4 border-b border-slate-800/80 bg-[#080d18]">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              ${ICON_SVG}
              <div>
                <h1 class="text-base font-black tracking-wide text-white">${t.appName}</h1>
                <p class="text-[11px] text-slate-400">${t.tagline}</p>
              </div>
            </div>
            <select onchange="changeLang(this.value)" class="bg-slate-900 text-white text-xs font-extrabold px-2.5 py-2 rounded-xl border border-slate-700">
              <option value="fr" ${state.lang === "fr" ? "selected" : ""}>🇫🇷 FR</option>
              <option value="en" ${state.lang === "en" ? "selected" : ""}>🇬🇧 EN</option>
              <option value="es" ${state.lang === "es" ? "selected" : ""}>🇪🇸 ES</option>
              <option value="ar" ${state.lang === "ar" ? "selected" : ""}>🇸🇦 AR</option>
              <option value="it" ${state.lang === "it" ? "selected" : ""}>🇮🇹 IT</option>
            </select>
          </div>
        </header>

        <main class="flex-1 p-4 overflow-y-auto">${mainHtml}</main>

        <nav class="grid grid-cols-4 border-t border-slate-800/90 bg-[#080d18] p-1.5 text-[11px] font-extrabold">
          <button onclick="setTab('home')" class="py-2.5 rounded-xl ${state.tab === 'home' ? 'bg-orange-500/20 text-orange-400' : 'text-slate-400'}">${t.home}</button>
          <button onclick="setTab('workouts')" class="py-2.5 rounded-xl ${state.tab === 'workouts' ? 'bg-cyan-500/20 text-cyan-300' : 'text-slate-400'}">${t.workouts}</button>
          <button onclick="setTab('challenges')" class="py-2.5 rounded-xl ${state.tab === 'challenges' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}">${t.challenges}</button>
          <button onclick="setTab('health')" class="py-2.5 rounded-xl ${state.tab === 'health' ? 'bg-purple-500/20 text-purple-400' : 'text-slate-400'}">${t.health}</button>
        </nav>
      `;
    }

    window.changeLang = (lang) => { state.lang = lang; render(); };
    window.setTab = (tab) => { state.tab = tab; render(); };
    window.selectPart = (idx) => { state.selectedIndex = idx; state.currentSet = 1; state.restSeconds = 0; state.tab = "workouts"; speak(TRANSLATIONS[state.lang].voiceLines.start); };
    window.startSessionNow = () => { state.currentSet = 1; state.restSeconds = 0; state.tab = "workouts"; speak(TRANSLATIONS[state.lang].voiceLines.start); };
    window.activateTrial = () => { state.isPro = true; speak(TRANSLATIONS[state.lang].proActive); };
    window.toggleVoice = () => { state.voiceEnabled = !state.voiceEnabled; render(); };
    window.skipRest = () => { clearInterval(timerInterval); state.restSeconds = 0; speak(TRANSLATIONS[state.lang].voiceLines.restEnd); };
    window.completeSet = () => {
      const t = TRANSLATIONS[state.lang];
      const series = BODY_PART_SERIES[state.selectedIndex];
      if (state.currentSet < series.sets) {
        state.currentSet += 1;
        startRest(series.rest, t.voiceLines.setDone);
      } else {
        speak(t.voiceLines.finish);
      }
    };
    window.advanceChallenge = (idx) => {
      if (CHALLENGES[idx].done < CHALLENGES[idx].days) CHALLENGES[idx].done += 1;
      render();
    };
    window.addWater = () => { if (state.water < 12) state.water += 1; render(); };

    render();
  </script>
</body>
</html>
